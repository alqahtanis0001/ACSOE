[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acsoe"
version = "0.1.0"
description = "Adaptive Crypto Spot Opportunity Engine — an automated Kraken spot trading system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ACSOE" }]

# Every dependency below appears in the stack table of
# context/architecture-context.md. Adding one that does not is an escalation to
# the lead, not a decision an agent may take.
dependencies = [
    # Exchange transport
    "websockets>=13.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    # Contracts
    "pydantic>=2.9",
    # Dataframes and numerics
    "polars>=1.9",
    "numpy>=1.26",
    # Columnar store
    "pyarrow>=17.0",
    "duckdb>=1.1",
    # Serialisation on the recording hot path
    "orjson>=3.10",
    # Console
    "fastapi>=0.115",
    "uvicorn>=0.31",
    # Structured logging
    "structlog>=24.4",
    # Configuration. Added to the stack table by the lead after C escalated
    # that the table named no YAML parser while config/default.yaml requires
    # one. Approved with a restriction that is part of the approval, not a
    # style note: `yaml.safe_load` only, never `yaml.load`.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Model, regime, explanation and statistics libraries. Split out of the base
# install by lead decision: nothing on the live loop path imports them before
# Phase 5, and architecture invariant 5 says the live loop never imports from
# research/ — the packaging now says so too. Every name is from the stack
# table; nothing has been added or dropped.
research = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "hmmlearn>=0.3.2",
    "shap>=0.46",
    "statsmodels>=0.14",
]
# `dev` includes `research`, so `pip install -e ".[dev]"` still installs
# everything and the setup line in README.md stays true.
dev = [
    "acsoe[research]",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
acsoe = "acsoe.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acsoe = ["py.typed"]

# ---------------------------------------------------------------------------
# mypy — code-standards.md requires --strict to pass on src/
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = false

[[tool.mypy.overrides]]
# numpy 2.5's bundled stubs use PEP 695 `type` statements, which mypy treats as a
# **syntax error** under `python_version = "3.11"`. A syntax error inside a
# followed import aborts the entire run rather than producing one error, so
# `mypy --strict src/` reported *nothing at all* the moment the first module in
# `src/` imported `polars` — which imports numpy. That is the dangerous failure
# mode: not a wrong answer, no answer, in the check the definition of done leans
# on.
#
# `polars` is listed alongside numpy because skipping numpy alone did not work —
# mypy still reaches the stubs through polars' own annotations — so the import has
# to be cut one level higher up.
#
# Skipping the imports rather than raising `python_version`, deliberately.
# `requires-python = ">=3.11"` and `architecture-context.md` both declare 3.11 as
# the floor, and pinning mypy to it is the only thing that actually checks the
# code runs there; raising it to 3.12 to satisfy a dependency's stubs would
# silently stop checking the promise the packaging makes. The cost is real and is
# worth stating: `polars` and `numpy` are `Any` to mypy, so a typo in a polars
# call is not caught. `engines/market_sensor/candles.py` is the only module that
# uses polars today and every value it produces is re-validated through a pydantic
# `Candle`, which is what makes the trade acceptable for now.
#
# Three ways out, none of them A's to choose alone: bump the declared floor to
# 3.12, pin `numpy<2.3` whose stubs parse under 3.11, or keep this. Raised with
# the lead 2026-09-09.
module = ["numpy", "numpy.*", "polars", "polars.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
    "duckdb.*",
    "hmmlearn.*",
    "lightgbm.*",
    "shap.*",
    "sklearn.*",
    "statsmodels.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors — includes E722, no bare except
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear — includes B006, no mutable default arguments
    "C4",   # comprehensions
    "PTH",  # flake8-use-pathlib — pathlib over os.path string handling
    "DTZ",  # flake8-datetimez — catches naive datetime.now() and utcnow()
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "TID",  # tidy imports
    "T20",  # no print() — the CLI and scripts/ are excepted below
    "RUF",  # ruff-specific
    "A",    # builtin shadowing
    "ISC",  # implicit string concat
    "PIE",
    "N",    # pep8 naming
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "RUF012", # ClassVar annotation on mutable class attrs — noisy with pydantic
]

[tool.ruff.lint.per-file-ignores]
# The CLI and the standalone recorder write to stdout on purpose.
"src/acsoe/cli/*" = ["T20"]
"scripts/*" = ["T20"]
"tests/*" = ["T20", "ARG", "N806"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "strict"
filterwarnings = ["error::DeprecationWarning:acsoe.*"]
